<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>baiPiao-hub 控制台</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e4e7ec; --ink:#1c2430; --muted:#65717f;
    --brand:#2f6fed; --brand-soft:#eaf1ff; --good:#12805c; --good-soft:#e7f6ef;
    --warn:#a86400; --warn-soft:#fdf3e2; --bad:#c0293b; --bad-soft:#fdecee;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  a{color:var(--brand)}
  h1,h2,h3{margin:0 0 10px;font-weight:650}
  h1{font-size:18px}h2{font-size:15px}h3{font-size:13px;color:var(--muted);text-transform:none}
  code,pre{font-family:var(--mono);font-size:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .spread{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .v{font-size:24px;font-weight:700;font-family:var(--mono)}
  .kpi .k{color:var(--muted);font-size:12px;margin-bottom:4px}
  button{font:inherit;padding:7px 13px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer}
  button:hover{border-color:#c9cfd8}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{filter:brightness(1.06)}
  button.danger{color:var(--bad);border-color:#f0cdd2}
  button.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink);width:100%}
  textarea{font-family:var(--mono);font-size:12px;min-height:90px;resize:vertical}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
    background:#eef1f5;color:var(--muted);white-space:nowrap}
  .pill.ok{background:var(--good-soft);color:var(--good)}
  .pill.off{background:var(--bad-soft);color:var(--bad)}
  .pill.info{background:var(--brand-soft);color:var(--brand)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .scroll{overflow:auto;max-height:520px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border-radius:999px;padding:6px 14px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hide{display:none!important}
  .banner{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.good{background:var(--good-soft);color:var(--good)}
  .banner.bad{background:var(--bad-soft);color:var(--bad)}
  .bar{height:7px;border-radius:999px;background:#eef1f5;overflow:hidden;min-width:70px}
  .bar>i{display:block;height:100%;background:var(--brand)}
  .login{max-width:380px;margin:8vh auto}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  details summary{cursor:pointer;color:var(--brand);font-size:13px}

/* ============ 移动端适配 ============ */
@media (max-width:768px){
  body{font-size:15px}
  h1{font-size:16px}
  .spread{flex-direction:column;align-items:stretch;gap:8px}
  .spread > div:last-child{display:flex;flex-wrap:wrap;gap:6px}
  .kpi .v{font-size:20px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .tabs{gap:4px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;padding:5px 11px;font-size:13px}
  .scroll{max-height:400px}
  table{font-size:13px}
  th,td{padding:6px 8px}
  td .row{gap:4px;flex-wrap:wrap}
  button.sm{padding:4px 8px;font-size:11px}
  .card{padding:12px;margin-bottom:10px}
}
@media (min-width:769px){
  .tabs{overflow-x:visible}
}
/* ============ 弹窗 ============ */
.modal-back{position:fixed;inset:0;background:rgba(16,22,30,.45);display:flex;align-items:flex-start;
  justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
  max-width:780px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.20)}
.modal .grid{grid-template-columns:1fr 1fr}
.modal h2{margin-bottom:12px}
/* 完整用户请求弹窗 */
.reqbox{max-width:720px;width:100%}
.reqbox pre{margin:0;background:var(--bg,#0d1117);color:var(--ink,#e6edf3);
  border:1px solid var(--line,#30363d);border-radius:10px;padding:12px;
  max-height:52vh;overflow:auto;font:12.5px/1.55 "Cascadia Code",Consolas,monospace;
  white-space:pre-wrap;word-break:break-word}
.reqbox .bar{display:flex;gap:8px;align-items:center;margin:10px 0 8px}
.reqbox .kv{display:flex;gap:8px;margin:3px 0}
.reqbox .hmeta{background:var(--panel,#161b22);border:1px solid var(--line,#30363d);
  border-radius:10px;padding:10px 12px;margin-top:10px}
.reqbox .trunc{color:var(--warn,#d29922);font-size:12px;margin-top:6px}
.reqbox .muted{color:var(--muted,#8b949e)}

/* ---------------- 实时动态图表（运行实况） ---------------- */
.live-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.live-head .win-pill{padding:3px 11px;border-radius:999px;border:1px solid var(--line,#e3e8ef);
  background:#fff;color:var(--sub,#5b6573);font-size:12px;font-weight:600;cursor:pointer}
.live-head .win-pill.on{background:var(--blue,#2f6fd6);color:#fff;border-color:var(--blue,#2f6fd6)}
.live-head .live-dot{width:9px;height:9px;border-radius:50%;background:var(--green,#2f9e6f);
  box-shadow:0 0 0 0 rgba(47,158,111,.6);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,111,.5)}70%{box-shadow:0 0 0 7px rgba(47,158,111,0)}100%{box-shadow:0 0 0 0 rgba(47,158,111,0)}}
.live-card{background:var(--card,#fff);border:1px solid var(--line,#e3e8ef);border-radius:14px;
  padding:16px 18px;margin:14px 0}
.live-card h3{margin:0 0 2px;font-size:15px}
.live-card .sub2{color:var(--sub,#5b6573);font-size:12px;margin-bottom:8px}
.live-canvas{width:100%;height:150px;display:block}
.live-readout{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.live-readout b{font-size:18px;font-weight:600}
.live-readout span{font-size:11px;color:var(--sub,#5b6573);display:block}
.live-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.live-legend .lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;
  background:#eef2f8;border-radius:999px;padding:2px 9px}
.live-legend .lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
</style>
</head>
<body>

<div id="app"></div>
<div id="modalRoot"></div>

<script>
const POOLS = ["text","image_1k","image_2k","image_3k","image_4k","video"];
const MODALITIES = ["text","image","video"];
const TYPES = ["free","enterprise","tokenplan","amd","openrouter"];
// 各 access_type 的默认 Base URL（与后端 DefaultBaseURLByType 对应）。
const DEFAULT_BASE_BY_TYPE = {
  free: "https://apihub.agnes-ai.com/v1",
  enterprise: "https://apihub.agnes-ai.com/v1",
  tokenplan: "https://apihub.agnes-ai.com/v1",
  amd: "https://developer.amd.com.cn/radeon/api/v1",
  openrouter: "https://openrouter.ai/api/v1"
};
const state = { tab:"overview", session:null, stats:null, accounts:null, keys:[], logs:[], settings:null, jobs:[], bindings:[] };

/* ---------------- 基础 ---------------- */
async function api(path, opts={}){
  const r = await fetch(path, {credentials:"same-origin",
    headers:{"Content-Type":"application/json"}, ...opts});
  const text = await r.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = {raw:text}; }
  if(!r.ok){
    const msg = (data && data.error && data.error.message) || ("HTTP "+r.status);
    const err = new Error(msg); err.status = r.status; err.data = data; throw err;
  }
  return data;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(n){ return Number(n||0).toLocaleString("en-US"); }
function toast(msg, kind){ const el=document.getElementById("toast"); if(!el) return;
  el.className = "banner "+(kind||"good"); el.textContent = msg; el.classList.remove("hide");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.add("hide"), 4200); }

/* ---------------- 登录 ---------------- */
function renderLogin(mustChange){
  document.getElementById("app").innerHTML = `
  <div class="login">
    <div class="card">
      <h1>baiPiao-hub 控制台</h1>
      <p class="muted">白嫖 Hub 聚合网关 · RPM 排队限流</p>
      <div id="toast" class="hide"></div>
      <label>管理员密码</label>
      <input id="pw" type="password" placeholder="请输入管理员密码" autocomplete="current-password">
      <div class="row" style="margin-top:12px">
        <button class="primary" id="btnLogin">登录</button>
        ${mustChange?`<span class="pill warn">首次登录请改密</span>`:""}
      </div>
      <div class="hint">登录状态保持 7 天；改密后所有会话立即失效。</div>
    </div>
  </div>`;
  const go = async ()=>{
    try{
      const r = await api("/api/login",{method:"POST",body:JSON.stringify({password:document.getElementById("pw").value})});
      state.session = {logged_in:true, must_change_password:r.must_change_password};
      await boot();
    }catch(e){ toast(e.message,"bad"); }
  };
  document.getElementById("btnLogin").onclick = go;
  document.getElementById("pw").onkeydown = e=>{ if(e.key==="Enter") go(); };
  document.getElementById("pw").focus();
}

/* ---------------- 主框架 ---------------- */
const TABS = [
  ["overview","总览"],["accounts","账号池"],["keys","下游密钥"],
  ["queue","队列"],["jobs","视频任务"],["intent","意图测试"],["logs","日志"],
  ["settings","设置"],["about","系统"]
];
function renderShell(){
  document.getElementById("app").innerHTML = `
  <div style="max-width:1240px;margin:0 auto;padding:20px">
    <div class="spread" style="margin-bottom:14px">
      <div>
        <h1>baiPiao-hub 控制台</h1>
        <div class="muted" id="subline">加载中…</div>
      </div>
      <div class="row">
        <a class="sm primary" href="/chat" target="_blank" rel="noopener" style="text-decoration:none">💬 对话 UI</a>
        <button class="sm" id="btnRefresh">刷新</button>
        <button class="sm" id="btnPw">修改密码</button>
        <button class="sm danger" id="btnLogout">退出</button>
      </div>
    </div>
    <div id="mustChange" class="hide"></div>
    <div id="toast" class="hide"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>`;
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = TABS.map(([k,label])=>`<button data-tab="${k}" class="${state.tab===k?"on":""}">${label}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; renderShell(); refresh(); });
  document.getElementById("btnRefresh").onclick = ()=>refresh();
  document.getElementById("btnLogout").onclick = async ()=>{ await api("/api/logout",{method:"POST"}); location.reload(); };
  document.getElementById("btnPw").onclick = changePassword;
}
async function changePassword(){
  const a = prompt("输入新密码（至少 6 位）"); if(!a) return;
  const b = prompt("再输入一次确认"); if(a!==b){ alert("两次输入不一致"); return; }
  try{ await api("/api/password",{method:"POST",body:JSON.stringify({new_password:a})});
    state.session.must_change_password=false; toast("密码已修改","good"); renderShell(); }
  catch(e){ alert(e.message); }
}

/* ---------------- 总览 ---------------- */
function arrivalCard(s){
  const a = s.arrival;
  if(!a || !Array.isArray(a.per_second) || a.per_second.length===0) return "";
  const maxVal = Math.max(1, ...a.per_second);
  // 迷你直方图（60 格，绿 = 节拍内，橙 = 超节拍）
  const intervalSec = a.text_interval_ms ? a.text_interval_ms/1000 : 3.0;
  const bars = a.per_second.map((v,i)=>{
    const h = Math.round(v/maxVal*100)||0;
    const over = intervalSec>0 && v > intervalSec;
    const color = over ? "var(--warn, #f59e0b)" : "var(--good, #22c55e)";
    return `<div title="${i}s 前 · ${v} req" style="height:28px;align-items:flex-end;display:flex">
      <div style="width:100%;height:${Math.max(2,h)}%;background:${v>0?color:"#333"};border-radius:1px;min-height:${v>0?2:0}px"></div></div>`;
  }).join("");
  const ratio = a.ratio||0;
  const ratioColor = ratio>=1?"var(--good,#22c55e)":"var(--warn,#f59e0b)";
  const ratioLabel = ratio>=1?"到达密度 ≥ 节拍，多账号已被吃到":
    ratio>=0.5?"到达密度接近节拍，账号数基本用满":
    "到达密度低于节拍，账号数不是瓶颈（宿主在串行）";
  return `
  <div class="card" style="margin-bottom:14px">
    <h2>到达密度 vs 文本池节拍 <span class="muted" style="font-size:12px">（多账号吞吐判定）</span></h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1;min-width:240px">
        <div style="display:flex;gap:2px;align-items:flex-end;height:28px;margin-bottom:4px">${bars}</div>
        <div class="muted" style="font-size:11px">最近 60 秒到达时间线（绿 = 节拍内 · 橙 = 超节拍）</div>
      </div>
      <div style="min-width:180px">
        <div style="font-size:24px;font-weight:600;color:${ratioColor}">${num(a.active_60s)}<span style="font-size:13px;color:inherit;font-weight:400"> / 60s</span></div>
        <div class="muted" style="font-size:12px">均值 ${a.avg_per_sec} req/s · text ${a.text_rpm||"—"} RPM · 节拍 ${a.text_interval_ms||"—"}ms</div>
        <div class="muted" style="font-size:12px;margin-top:6px;padding:6px 10px;background:rgba(0,0,0,.04);border-radius:6px">
          <span style="color:${ratioColor};font-weight:600">比值 ${ratio}</span>：${ratioLabel}
        </div>
      </div>
    </div>
  </div>`;
}

function viewOverview(){
  const s = state.stats || {}, m = s.metrics || {};
  const uls = m.upstream_429 || 0;
  const banner = uls === 0
    ? `<div class="banner good">上游 429 次数为 0 —— 限流排队生效，客户端没有被限流过。</div>`
    : `<div class="banner warn">上游已返回 ${uls} 次 429。系统会自动下调该账号该池的节拍（其它池不受影响），并已把客户端请求排队而非报错。</div>`;
  const accRows = (s.accounts||[]).map(a=>{
    const buckets = a.buckets||{};
    const active = POOLS.filter(p=>buckets[p] && buckets[p].rpm>0);
    const bars = active.map(p=>{
      const b = buckets[p]||{};
      const load = Math.min(100, Math.round((b.waiting? (b.projected_wait_ms/1000)*100/6 : 0)));
      return `<div style="margin-bottom:4px">
        <span class="pill ${b.factor<1?"warn":""}">${esc(p)} · ${b.rpm} RPM</span>
        <span class="muted" style="font-size:11px">排队 ${b.waiting} 人 · 预计 ${Math.round((b.projected_wait_ms||0)/100)/10}s · 校准 ${b.factor}</span>
        <div class="bar"><i style="width:${load}%"></i></div>
      </div>`;
    }).join("");
    const declared = MODALITIES.map(mod=>{
      const list = [];
      active.forEach(p=>{ (buckets[p]?.declared||[]).forEach(x=>{ if(!list.includes(x)) list.push(x); }); });
      return list.length? `<div class="muted" style="font-size:11px">${esc(mod)}: <span class="mono">${esc(list.join(", "))}</span></div>`:"";
    }).join("");
    return `<tr>
      <td><b>${esc(a.name)}</b>${a.group?` <span class="pill">${esc(a.group)}</span>`:""}
        <div class="muted" style="font-size:11px">${esc(a.access_type)}</div></td>
      <td>${a.enabled?'<span class="pill ok">启用</span>':'<span class="pill off">停用</span>'}
        ${a.penalty_remaining_ms>0?`<span class="pill warn">冷却 ${Math.round(a.penalty_remaining_ms/1000)}s</span>`:""}
        ${a.consecutive_failures && a.stats?.errors ? `<span class="pill warn" title="连续失败 ${a.consecutive_failures}">连续失败 ${a.consecutive_failures}</span>` : ''}</td>
      <td style="min-width:210px">${bars||'<span class="muted">无可用池</span>'}${declared}</td>
      <td class="mono">${num(a.stats?.requests)} / 错误 ${num(a.stats?.errors)} / 限流 ${num(a.stats?.rate_limited)}</td>
    </tr>`;
  }).join("");
  return `
  ${banner}
  ${liveSection()}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi"><div class="k">请求总数</div><div class="v">${num(m.requests_total)}</div></div>
    <div class="kpi"><div class="k">成功</div><div class="v">${num(m.requests_ok)}</div></div>
    <div class="kpi"><div class="k" style="color:${uls?"var(--good)":"var(--muted)"}">上游 429</div><div class="v" style="color:${uls?"var(--good)":"inherit"}">${num(uls)}</div></div>
    <div class="kpi"><div class="k">排队过</div><div class="v">${num(m.queued_total)}</div></div>
    <div class="kpi"><div class="k">平均等待</div><div class="v">${num(s.avg_wait_ms)}<span style="font-size:13px">ms</span></div></div>
    <div class="kpi"><div class="k">粘性溢出</div><div class="v">${num(m.spillovers)}</div><div class="muted" style="font-size:11px">绑定账号拥堵时改派次数</div></div>
    <div class="kpi"><div class="k">熔断 / 复活</div><div class="v">${num(m.breaker_opened)} / ${num(m.breaker_revived)}</div></div>
    <div class="kpi"><div class="k">账号 / 密钥</div><div class="v">${num((s.accounts||[]).length)} / ${num(s.keys)}</div></div>
  </div>
  ${arrivalCard(s)}
  <div class="card">
    <h2>账号负载</h2>
    <div class="scroll"><table>
      <thead><tr><th>账号</th><th>状态</th><th>各池节拍与已声明模型</th><th>累计</th></tr></thead>
      <tbody>${accRows||'<tr><td colspan="4" class="muted">还没有账号，请到「账号池」添加</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

/* ---------------- 账号池 ---------------- */
function manifestEditor(id, manifest){
  const m = manifest || {};
  return MODALITIES.map(mod=>`
    <div>
      <label>${mod} 模型（逗号分隔；<b>留空 = 明示不支持该模态</b>）</label>
      <input id="${id}_${mod}" value="${esc((m[mod]||[]).join(", "))}" placeholder="例如 default-model, default-model">
    </div>`).join("");
}
function viewAccounts(){
  const data = state.accounts || {accounts:[]};
  const rows = (data.accounts||[]).map(a=>{
    const eff = a.rpm_effective||{}, base = a.rpm_base||{};
    const rpm = POOLS.filter(p=>(base[p]||0)>0).map(p=>{
      const b = base[p], e = eff[p];
      return `<span class="pill ${e<b?"warn":""}" title="标称 ${b} → 校准后 ${e}">${p} ${e}</span>`;
    }).join(" ");
    return `<tr>
      <td><b>${esc(a.name)}</b>
        <div class="muted" style="font-size:11px">${esc(a.group||"—")} · ${esc(a.access_type)} · <span class="mono">${esc(a.api_key_masked)}</span></div>
        <div class="muted" style="font-size:11px" title="${esc(a.base_url)}">${esc(a.base_url)}</div>
        <div class="muted mono" style="font-size:11px">text: ${esc((a.model_manifest?.text||[]).join(", ")||"（不支持）")}</div>

function bindAccountEvents(){
  const view = document.getElementById("view");
  const add = document.getElementById("btnAddAcc");
  const typeSel = document.getElementById("aType");
  if(typeSel) typeSel.onchange = ()=>{
    const baseEl = document.getElementById("aBase");
    if(baseEl && baseEl.value.trim()==="") baseEl.placeholder = "留空将自动套用：" + (DEFAULT_BASE_BY_TYPE[typeSel.value]||"");
  };
  if(add) add.onclick = async ()=>{
    const manifest = {}; MODALITIES.forEach(m=>manifest[m] = document.getElementById("aMf_"+m).value.split(",").map(s=>s.trim()).filter(Boolean));
    const rpm = {}; POOLS.forEach(p=>{ const v=document.getElementById("aRPM_"+p).value.trim(); if(v!=="") rpm[p]=Number(v); });
    try{
      await api("/api/accounts",{method:"POST",body:JSON.stringify({

        base_url:document.getElementById("aBase").value, access_type:document.getElementById("aType").value,
        group:document.getElementById("aGroup").value, max_concurrency:Number(document.getElementById("aConc").value)||8,
        priority:Number(document.getElementById("aPriority").value)||0,
        default_model:document.getElementById("aDefaultModel").value,
        model_manifest:manifest, rpm_overrides:rpm
      })});
      toast("账号已添加","good"); await refresh();
    }catch(e){ toast(e.message,"bad"); }
  };
  const bulk = document.getElementById("btnBulk");
  if(bulk) bulk.onclick = async ()=>{
    try{
      const r = await api("/api/accounts/bulk",{method:"POST",body:JSON.stringify({text:document.getElementById("bulkText").value})});
      const f = (r.failed||[]).map(x=>`<div class="banner bad">第 ${x.line} 行：${esc(x.reason)}<br><span class="mono">${esc(x.text)}</span></div>`).join("");
      document.getElementById("bulkResult").innerHTML =
        `<div class="banner good">成功导入 ${r.added_count} 个账号</div>${f}`;
      await refresh();
    }catch(e){ toast(e.message,"bad"); }
  };
  const bu = document.getElementById("btnBulkUpdate");
  if(bu) bu.onclick = async ()=>{
    const op = document.getElementById("bulkOp").value;
    try{
      const r = await api("/api/accounts/bulk-update",{method:"POST",body:JSON.stringify({
        group:document.getElementById("bulkGroup").value.trim(), enabled: op==="enable"
      })});
      toast(`已更新 ${r.updated} / ${r.matched} 个账号`,"good"); await refresh();
    }catch(e){ toast(e.message,"bad"); }
  };
  view.querySelectorAll("button[data-act]").forEach(b=>b.onclick=()=>accountAction(b.dataset.act,b.dataset.id,b.dataset.on));
}
/* ---------------- 弹窗基础 ---------------- */
function openModal(html){
  let r = document.getElementById("modalRoot");
  if(!r){ r = document.createElement("div"); r.id="modalRoot"; document.body.appendChild(r); }
  r.innerHTML = html;
}
function closeModal(){ const r = document.getElementById("modalRoot"); if(r) r.innerHTML = ""; }

        <div><label>Base URL（留空按类型自动套用）</label><input id="eBase" value="${esc(acc.base_url)}"></div>

          <div style="flex:1"><label>账号类型</label>

          <div style="flex:1"><label>优先级（越大越优先）</label><input id="ePriority" type="number" value="${acc.priority||0}" min="0"></div>
        </div>
        <div><label>兜底模型（可选）</label><input id="eDefaultModel" value="${esc(acc.default_model||"")}" placeholder="留空=auto"></div>
        ${manifestEditor("eMf", mf)}
        <details open><summary>各池 RPM 覆盖（留空 = 按类型档位表）</summary>
          <div class="row" style="margin-top:8px">
            ${POOLS.map(p=>`<div style="flex:1"><label>${p}</label><input id="eRPM_${p}" type="number" min="0" value="${rpm[p]||""}" placeholder="按档位"></div>`).join("")}

        </div>
      </div>

  openModal(html);
  const eType = document.getElementById("eType");
  eType.onchange = ()=>{
    const baseEl = document.getElementById("eBase");
    if(baseEl && baseEl.value.trim()==="") baseEl.placeholder = "留空将自动套用：" + (DEFAULT_BASE_BY_TYPE[eType.value]||"");
  };
  document.getElementById("btnSaveAcc").onclick = async ()=>{
    try{
      const manifest = {}; MODALITIES.forEach(m=>manifest[m]=document.getElementById("eMf_"+m).value.split(",").map(s=>s.trim()).filter(Boolean));
      const rpmOv = {}; POOLS.forEach(p=>{ const v=document.getElementById("eRPM_"+p).value.trim(); if(v!=="") rpmOv[p]=Number(v); });
      const body = {
        name:document.getElementById("eName").value, base_url:document.getElementById("eBase").value,
        access_type:document.getElementById("eType").value, group:document.getElementById("eGroup").value,
        max_concurrency:Number(document.getElementById("eConc").value)||8,

      };
      const k = document.getElementById("eKey").value.trim(); if(k!=="") body.api_key = k;
      await api("/api/accounts/"+id,{method:"PATCH",body:JSON.stringify(body)});
      toast("已保存","good"); closeModal(); await refresh();

async function accountAction(act,id,on){
  try{
    if(act==="test"){
      toast("正在测试…（会向上游发一个最小请求）","warn");
      const r = await api("/api/accounts/"+id+"/test",{method:"POST"});
      const drift = (r.drift||[]).map(d=>`<div class="banner warn">${esc(d.modality)} 的 <span class="mono">${esc(d.model)}</span>：${esc(d.issue)}</div>`).join("");
      document.getElementById("view").insertAdjacentHTML("afterbegin",
        `<div class="card"><div class="spread"><h2>测试结果</h2><button class="sm" onclick="this.closest('.card').remove()">关闭</button></div>
          <div class="banner ${r.ok?"good":"bad"}">HTTP ${r.status} · ${r.latency_ms}ms · ${esc(r.hint)}</div>
          ${drift}
          ${r.models&&r.models.length?`<details open><summary>上游真实可用模型（${r.models.length}）</summary>
            <div class="mono" style="margin-top:8px;font-size:12px">${esc(r.models.join(", "))}</div></details>`:""}
          ${r.body?`<details><summary>响应体</summary><pre class="mono">${esc(r.body)}</pre></details>`:""}
        </div>`);
      return;
    }
    if(act==="toggle"){ await api("/api/accounts/"+id,{method:"PATCH",body:JSON.stringify({enabled:on!=="1"})}); }
    if(act==="factors"){ await api("/api/accounts/"+id+"/reset-factors",{method:"POST"}); toast("校准系数已复位","good"); }
    if(act==="del"){ if(!confirm("确认删除该账号？")) return; await api("/api/accounts/"+id,{method:"DELETE"}); }
    if(act==="edit"){
      const acc = (state.accounts.accounts||[]).find(x=>x.id===id); if(!acc) return;
      editAccountModal(acc);
    }
    await refresh();
  }catch(e){ toast(e.message,"bad"); }
}

// 弹出某条日志的「用户提出的完整请求」原文（可滚动 + 一键复制 + 该条元信息）。
function showUserRequest(i){
  const l = (state.logs||[])[i];
  if(!l) return;
  const raw = l.user_request||"";
  const truncated = /…\(truncated\)$/.test(raw);
  const meta = [
    ["时间", l.ts], ["端点", l.endpoint], ["池", l.pool_class], ["意图", l.intent],
    ["意图判定", l.intent_by], ["模型(请求/实际)", `${l.model_requested||"-"} / ${l.model_used||"-"}`],
    ["账号", l.account], ["等待", l.wait_ms!=null?Math.round(l.wait_ms)+"ms":"-"],
    ["阶段", l.phase], ["stream", l.stream],
  ].filter(x=>x[1]!=null && x[1]!=="").map(x=>`<div class="kv"><span class="muted" style="font-size:11px">${esc(x[0])}</span> <span class="mono">${esc(String(x[1]))}</span></div>`).join("");
  const html = `
    <div class="modal-back" onclick="if(event.target===this)closeModal()">
      <div class="modal reqbox">
        <div class="spread"><h2>用户提出的完整请求</h2>

        ${truncated?`<div class="trunc">⚠ 该字段在落盘时已被截断到上限（仅保留前 N 字节），完整原文未持久化；以下为已保留部分。</div>`:""}
        <div class="bar">
          <button class="sm" onclick="copyUserRequest(${i})">复制全文</button>
          <span class="muted" style="font-size:12px">${(raw.length/1024).toFixed(1)} KB</span>

        <pre>${esc(raw)||"（该记录无 user_request 字段）"}</pre>
        <div class="hmeta">${meta}</div>
      </div>
    </div>`;
  openModal(html);
}

// 一键复制某条日志的 user_request 全文（按序号读取，避免把任意文本内联进 onclick）。
function copyUserRequest(i){
  const l = (state.logs||[])[i]; if(!l) return;
  const raw = l.user_request||"";
  copyText(raw, ()=>toast("已复制完整请求到剪贴板","good"));
}

// 通用复制（clipboard API 优先，失败降级 execCommand）。
function copyText(text, onDone){
  const done=ok=>{ if(onDone) onDone(ok); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(text)).then(()=>done(true),
      ()=>fallbackCopy(String(text),done));
  } else fallbackCopy(String(text),done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  done(ok); if(!ok && location && location.hostname!=="localhost"){ toast("复制失败，请手动全选 pre 内文本","bad"); }
}

function setupCanvas(cv){
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth||600, h = cv.clientHeight||150;
  const cw = Math.round(w*dpr), ch = Math.round(h*dpr);
  if(cv.width!==cw||cv.height!==ch){ cv.width=cw; cv.height=ch; }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}
function inkColor(){ return getComputedStyle(document.body).color || "#5b6573"; }
function emptyHint(cv, text){
  const {ctx,w,h}=setupCanvas(cv);
  ctx.globalAlpha=.55; ctx.fillStyle=inkColor(); ctx.font="12px sans-serif"; ctx.textAlign="center";
  ctx.fillText(text, w/2, h/2); ctx.globalAlpha=1;
}

// drawLines：通用滚动折线/面积图（支持右轴与参考线、事件刻度）
function drawLines(cv, series, opts){
  const {ctx,w,h}=setupCanvas(cv);
  const padL=36, padR=opts.rightMax?34:12, padT=8, padB=18;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const ink=inkColor();
  ctx.strokeStyle="rgba(140,140,140,.22)"; ctx.lineWidth=1; ctx.font="10px sans-serif";
  for(let g=0;g<=4;g++){
    const y=padT+plotH*g/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.globalAlpha=.7; ctx.fillStyle=ink;
    ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillText(String(Math.round(opts.leftMax*(1-g/4))), padL-5, y);
    if(opts.rightMax){ ctx.textAlign="left"; ctx.fillText(String(Math.round(opts.rightMax*(1-g/4))), w-padR+5, y); }
    ctx.globalAlpha=1;
  }
  const n = Math.max(1, Math.max.apply(null, series.map(s=>s.data.length||0)));
  if(n<2){ emptyHint(cv,"采样中…每秒一个点，稍等即出"); return; }
  const xAt=i=>padL+(i/(n-1))*plotW;
  series.forEach(s=>{
    const max=(s.axis==="r"?opts.rightMax:opts.leftMax)||1;
    const yAt=v=>padT+plotH-Math.max(0,Math.min((v||0)/max,1))*plotH;
    if(s.fill){
      ctx.beginPath(); ctx.moveTo(xAt(0),padT+plotH);
      s.data.forEach((v,i)=>ctx.lineTo(xAt(i),yAt(v)));
      ctx.lineTo(xAt(s.data.length-1),padT+plotH); ctx.closePath();
      ctx.fillStyle=s.color; ctx.globalAlpha=.17; ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.beginPath();
    s.data.forEach((v,i)=>{ const x=xAt(i),y=yAt(v); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.strokeStyle=s.color; ctx.lineWidth=s.width||2;
    if(s.dash) ctx.setLineDash(s.dash);
    ctx.stroke(); ctx.setLineDash([]);
  });
  (opts.refY||[]).forEach(r=>{
    const max=(r.axis==="r"?opts.rightMax:opts.leftMax)||1;
    const y=padT+plotH-Math.min(r.v/max,1)*plotH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y);
    ctx.strokeStyle=r.color; ctx.setLineDash([4,4]); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  });
  (opts.events||[]).forEach((e,i)=>{
    if(!e) return;
    const x=padL+(i/(n-1))*plotW;
    ctx.fillStyle=(e&1)?"#d64545":"#e08a1e";
    ctx.fillRect(x-1, h-padB+3, 2, 6);
  });
}

// drawStack：多账号分配堆叠面积（每秒归一化到 100%）
function drawStack(cv, meta, cols, events){
  const {ctx,w,h}=setupCanvas(cv);
  const padL=6,padR=6,padT=8,padB=18;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n=cols.length||0;
  ctx.strokeStyle="rgba(140,140,140,.22)"; ctx.lineWidth=1;
  for(let g=1;g<4;g++){
    const y=padT+plotH*g/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
  }
  if(n<2||!meta.length){ emptyHint(cv,"采样中…"); return; }
  const totalAll=cols.reduce((a,c)=>a+c.reduce((x,y)=>x+y,0),0);
  if(totalAll<=0){
    ctx.globalAlpha=.55; ctx.fillStyle=inkColor(); ctx.font="12px sans-serif"; ctx.textAlign="center";
    ctx.fillText("窗口内没有完成任何请求（空闲中）", w/2, h/2-6); ctx.globalAlpha=1;
  }
  const xAt=i=>padL+(n>1?(i/(n-1))*plotW:0);
  let prev=new Array(n).fill(0);
  for(let k=0;k<meta.length;k++){
    const cur=new Array(n);
    for(let i=0;i<n;i++){
      const tot=cols[i].reduce((a,b)=>a+b,0)||0;
      cur[i]=prev[i]+(tot>0?(cols[i][k]||0)/tot:0);
    }
    ctx.beginPath();
    for(let i=0;i<n;i++){ const x=xAt(i),y=padT+plotH-cur[i]*plotH; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    for(let i=n-1;i>=0;i--){ const x=xAt(i),y=padT+plotH-prev[i]*plotH; ctx.lineTo(x,y); }
    ctx.closePath();
    ctx.fillStyle=meta[k].color||"#2f6fd6"; ctx.globalAlpha=.82; ctx.fill(); ctx.globalAlpha=1;

    // 在色块上直接标注账号名：从中间往外找第一个「够厚」的位置，避免每秒左右跳动；
    // 太窄的带（小于 13px）不画，防止小账号文字叠成一团。
    const mid=Math.floor(n/2);
    let li=-1;
    for(let d=0; d<=mid && li<0; d++){
      for(const i of (d===0?[mid]:[mid-d,mid+d])){
        if(i>=0&&i<n&&(cur[i]-prev[i])*plotH>=13){ li=i; break; }
      }
    }
    if(li>=0){
      const thick=(cur[li]-prev[li])*plotH;
      const cx=Math.max(padL+26, Math.min(w-padR-26, xAt(li)));
      const cy=padT+plotH-(prev[li]+(cur[li]-prev[li])/2)*plotH;
      let label=meta[k].name||meta[k].id||"";
      if(label.length>12) label=label.slice(0,11)+"…";
      ctx.font="600 11px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.lineWidth=3; ctx.lineJoin="round";
      ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.strokeText(label,cx,cy); // 描边保证浅色带也看得清
      ctx.fillStyle="#fff"; ctx.fillText(label,cx,cy);
      if(thick>=30){ // 带宽足够时顺带标百分比
        const pct=Math.round((cur[li]-prev[li])*100)+"%";
        ctx.font="10px sans-serif";
        ctx.strokeText(pct,cx,cy+12); ctx.fillText(pct,cx,cy+12);
      }
    }
    prev=cur;
  }
  (events||[]).forEach((e,i)=>{
    if(!e) return;
    const x=xAt(i);
    ctx.fillStyle=(e&1)?"#d64545":"#e08a1e";
    ctx.fillRect(x-1, h-padB+3, 2, 6);
  });
}

function drawLive(){
  if(!LIVE.hist) return;
  const cvL=document.getElementById("cvLoad"), cvS=document.getElementById("cvScale"), cvA=document.getElementById("cvAcc");
  if(!cvL||!cvS||!cvA) return;
  const slice=(LIVE.hist.points||[]).slice(-liveWantPoints());
  if(!slice.length){
    emptyHint(cvL,"采样中…"); emptyHint(cvS,"采样中…"); emptyHint(cvA,"采样中…"); return;
  }
  const events=slice.map(p=>p.events||0);

  // ① 负载率
  const load=slice.map(p=>p.load_pct||0);
  const cur=load[load.length-1]||0;
  const peak=Math.max.apply(null,load);
  const avg=load.reduce((a,b)=>a+b,0)/load.length;
  const c1=cur>=100?"#d64545":(cur>=70?"#e08a1e":"#2f9e6f");
  drawLines(cvL,[{data:load,color:c1,fill:true}],{leftMax:Math.max(120,peak)*1.1,refY:[{v:100,color:"#d64545"}],events});
  document.getElementById("roLoad").innerHTML=
    `<div><b style="color:${c1}">${cur.toFixed(0)}%</b><span>当前负载率</span></div>
     <div><b>${peak.toFixed(0)}%</b><span>窗口峰值</span></div>
     <div><b>${avg.toFixed(0)}%</b><span>窗口均值</span></div>`;

  // ② 处理规模
  const arrive=slice.map(p=>p.arrive_rps||0), done=slice.map(p=>p.done_rps||0);
  const inf=slice.map(p=>p.inflight||0), q=slice.map(p=>p.queue_depth||0);
  const lmax=Math.max(5,Math.max.apply(null,arrive.concat(done,inf)))*1.25;
  const rmax=Math.max(2,Math.max.apply(null,q))*1.3;
  drawLines(cvS,[
    {data:q,color:"#e08a1e",fill:true,axis:"r"},
    {data:arrive,color:"#2f6fd6"},
    {data:done,color:"#2f9e6f"},
    {data:inf,color:"#7a52c7",width:1.5,dash:[4,3]}
  ],{leftMax:lmax,rightMax:rmax,events});
  const last=slice[slice.length-1]||{};
  document.getElementById("roScale").innerHTML=
    `<div><b style="color:#2f6fd6">${(last.arrive_rps||0).toFixed(1)}</b><span>到达 req/s</span></div>
     <div><b style="color:#2f9e6f">${(last.done_rps||0).toFixed(1)}</b><span>完成 req/s</span></div>
     <div><b style="color:#7a52c7">${last.inflight||0}</b><span>在途</span></div>
     <div><b style="color:#e08a1e">${last.queue_depth||0}</b><span>排队</span></div>
     <div><b>${last.r429_pm||0}</b><span>429/分钟</span></div>`;

  // ③ 多账号分配
  const meta=LIVE.meta||[];
  const cols=slice.map(p=>{
    const byId={}; (p.acc||[]).forEach(a=>{ byId[a.id]=a.done_delta||0; });
    return meta.map(m=>byId[m.id]||0);
  });
  drawStack(cvA,meta,cols,events);
  const lastCol=cols[cols.length-1]||[];
  const lt=lastCol.reduce((a,b)=>a+b,0)||0;
  document.getElementById("lgAcc").innerHTML = meta.map((m,i)=>{
    const pct = lt>0 ? Math.round((lastCol[i]||0)/lt*100) : 0;
    return `<span class="lg"><i style="background:${m.color}"></i>${esc(m.name||m.id)} ${pct}%</span>`;
  }).join("") || `<span class="muted">还没有账号</span>`;
}

async function liveTick(){
  if(state.tab!=="overview" || document.visibilityState!=="visible") return;
  if(!document.getElementById("cvLoad")) return;
  try{
    LIVE.hist = await api("/api/metrics-history?win="+(liveUseCoarse()?"coarse":"fine"));
    LIVE.meta = LIVE.hist.accounts||[];
    drawLive();
  }catch(e){ /* 静默：下一次 tick 自动重试 */ }
}
function startLiveTimer(){
  if(LIVE.timer) return;
  LIVE.timer = setInterval(liveTick, 1000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") liveTick(); });
  window.addEventListener("resize", ()=>{ if(state.tab==="overview") drawLive(); });
}
function bindLive(){
  startLiveTimer();
  document.querySelectorAll(".win-pill").forEach(b=>{
    b.onclick=()=>{ LIVE.win=b.dataset.win; render(); liveTick(); };
  });
  liveTick();
}

/* ---------------- 数据拉取 ---------------- */
async function refresh(){
  try{
    const [stats, accounts, keys, logs, settings, jobs, bindings, scenarios] = await Promise.all([
      api("/api/stats"), api("/api/accounts"), api("/api/keys"), api("/api/logs?limit=300"),
      api("/api/settings"), api("/api/video-jobs"), api("/api/bindings"),
      api("/api/scenarios").catch(()=>({scenarios:[]}))
    ]);
    state.stats = stats; state.accounts = accounts; state.keys = keys.keys||[];
    state.logs = logs.logs||[]; state.settings = settings;
    state.jobs = jobs.jobs||[]; state.bindings = bindings.bindings||[];
    state.scenarios = scenarios.scenarios||[];
    state.scenarioData = scenarios; // 完整响应（含 recommend/auto_scenario/rate_limit_*）
    state.stats.queue = (await api("/api/queue")).queue||[];
    const m = stats.metrics||{};
    document.getElementById("subline").textContent =
      `账号 ${(stats.accounts||[]).length} · 请求 ${num(m.requests_total)} · 上游 429 ${num(m.upstream_429)} · 排队 ${num(m.queued_total)} · 运行 ${m.uptime_sec||0}s`;
    render();
  }catch(e){
    if(e.status===401){ renderLogin(false); return; }
    toast(e.message,"bad");
  }
}
function render(){
  const v = document.getElementById("view");
  if(state.tab==="overview"){ v.innerHTML = viewOverview(); bindLive(); }
  else if(state.tab==="accounts"){ v.innerHTML = viewAccounts(); bindAccountEvents(); }
  else if(state.tab==="keys"){ v.innerHTML = viewKeys(); bindKeyEvents(); }
  else if(state.tab==="queue"){
    v.innerHTML = viewQueue();
    const b = document.getElementById("btnClearBind");
    if(b) b.onclick = async ()=>{ if(!confirm("清空全部粘性绑定？")) return;
      await api("/api/bindings/clear",{method:"POST"}); await refresh(); };
  }
  else if(state.tab==="jobs"){ v.innerHTML = viewJobs(); }
  else if(state.tab==="intent"){ v.innerHTML = viewIntent(); bindIntentEvents(); }
  else if(state.tab==="logs"){ v.innerHTML = viewLogs(); }
  else if(state.tab==="settings"){ v.innerHTML = viewSettings(); bindSettingsEvents(); }
  else if(state.tab==="about"){ v.innerHTML = viewAbout(); bindAboutEvents(); }
}

      <button class="sm primary" id="btnApply">立即更新</button>
      <a class="muted" style="font-size:12px" target="_blank" rel="noopener noreferrer"
         href="https://github.com/my788525/agnes-hub-go/releases">查看全部版本 ↗</a>
    </div>
  </div>
  <div class="card">
    <h2>运行环境</h2>

function bindAboutEvents(){
  const kpi = document.getElementById("updKpi");
  const box = document.getElementById("updBox");
  const env = document.getElementById("envBox");

  const paintEnv = ()=>{
    const s = state.stats || {}, m = s.metrics || {};
    const up = Number(m.uptime_sec||0);
    const d = Math.floor(up/86400), h = Math.floor(up%86400/3600), mi = Math.floor(up%3600/60);
    env.textContent = `已运行 ${d?d+"天 ":""}${h}小时${mi}分 · 请求总数 ${num(m.requests_total)}`
      + ` · 上游 429 ${num(m.upstream_429)} · 排队 ${num(m.queued_total)}`
      + ` · 账号 ${(s.accounts||[]).length} 个`;
  };

  const paint = (s, err)=>{
    const cur = s.current_version || "—";
    const last = s.last_check || {};
    const avail = !!last.is_update_available;
    kpi.innerHTML = `
      <div class="kpi"><div class="k">当前版本</div><div class="v">${esc(cur)}</div></div>
      <div class="kpi"><div class="k">最新版本</div><div class="v">${esc(last.latest_version || "—")}</div></div>
      <div class="kpi"><div class="k">更新状态</div><div class="v" style="font-size:15px">
        ${avail ? '<span class="pill warn">有可用更新</span>'
                : '<span class="pill ok">已是最新</span>'}</div></div>
      <div class="kpi"><div class="k">发布时间</div><div class="v" style="font-size:15px">${esc(last.release_date || "—")}</div></div>`;

    if(err || last.error){
      box.innerHTML = `<div class="banner warn">${esc(err || last.error)}</div>`;
      return;
    }
    if(!avail){
      box.innerHTML = `<div class="banner good">当前已是最新版本，无需更新。</div>`;
      return;
    }
    const notes = (last.changelog||"").trim();
    box.innerHTML = `<div class="banner warn">
        发现新版本 <b>${esc(last.latest_version)}</b>（当前 ${esc(cur)}）。
        点「立即更新」会下载对应平台的二进制并替换，随后程序自动退出并重启。
      </div>
      ${notes? `<pre class="scroll" style="background:#fafbfc;border:1px solid var(--line);
        border-radius:10px;padding:12px;margin:0">${esc(notes)}</pre>`:""}`;
  };

  const load = async ()=>{
    try{ paint(await api("/api/update/status")); }
    catch(e){ kpi.innerHTML = `<div class="kpi"><div class="k">错误</div><div class="v">—</div></div>`;
              box.innerHTML = `<div class="banner warn">${esc(e.message)}</div>`; }
  };

  document.getElementById("btnChk").onclick = async (ev)=>{
    const b = ev.currentTarget; b.disabled = true; b.textContent = "检查中…";
    try{ paint(await api("/api/update/check")); toast("已检查更新","good"); }
    catch(e){ toast(e.message,"bad"); }
    finally{ b.disabled = false; b.textContent = "检查更新"; }
  };

  document.getElementById("btnApply").onclick = async (ev)=>{
    const b = ev.currentTarget;
    if(!confirm("确认下载并更新到最新版本？\n更新完成后程序会自动重启。")) return;
    b.disabled = true; b.textContent = "更新中…";
    try{
      const r = await api("/api/update/apply",{method:"POST"});
      if(r.success){
        toast("更新已就位，程序即将重启","good");
        box.innerHTML = `<div class="banner good">已更新到 <b>${esc(r.new_version)}</b>，
          程序正在退出以便替换二进制，稍后会自动重启。若未自动重启，请手动重新启动一次。</div>`;
      }else{
        toast(r.error||"更新失败","bad");
        box.innerHTML = `<div class="banner warn">更新失败：${esc(r.error||"未知原因")}</div>`;
      }
    }catch(e){ toast(e.message,"bad"); }
    finally{ b.disabled = false; b.textContent = "立即更新"; }
  };

  paintEnv();
  load();
}

async function boot(){
  if(!state.session || !state.session.logged_in){ renderLogin(false); return; }
  renderShell();
  await refresh();
}
window.addEventListener("DOMContentLoaded", async ()=>{
  try{
    const s = await api("/api/session");
    state.session = s;
    if(s.logged_in) await boot(); else renderLogin(s.must_change_password);
  }catch(e){ renderLogin(false); }
});
</script>
</body>
</html>
